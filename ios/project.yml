# Xcode-проект iOS-клиента remote-pc-manager (генерируется xcodegen).
# Пересоздать проект: cd ios && xcodegen generate
name: RemotePC
options:
  bundlePrefix: ru.vmitin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"   # только iPhone
    CODE_SIGN_STYLE: Automatic
targets:
  RemotePC:
    type: application
    platform: iOS
    sources:
      - RemotePC
    info:
      path: RemotePC/Info.plist
      properties:
        CFBundleDisplayName: "Удалённый ПК"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # plain HTTP в локальной сети (как у веб-клиента)
        NSLocalNetworkUsageDescription: "Приложению нужен доступ к локальной сети, чтобы видеть сервер на ПК и отправлять WoL-пакеты."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vmitin.remotepc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 49ZG648WG8   # Personal Team (Вячеслав Митин)
