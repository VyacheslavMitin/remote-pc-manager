# Xcode-проект iOS/watch-клиентов remote-pc-manager (генерируется xcodegen).
# Пересоздать проект: cd ios && xcodegen generate
name: RemotePC
options:
  bundleIdPrefix: ru.vmitin
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  RemotePC:
    type: application
    platform: iOS
    sources:
      - path: RemotePC
    info:
      path: RemotePC/Info.plist
      properties:
        CFBundleDisplayName: "Удалённый ПК"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # plain HTTP в локальной сети (как у веб-клиента)
        NSLocalNetworkUsageDescription: "Приложению нужен доступ к локальной сети, чтобы видеть сервер на ПК и отправлять WoL-пакеты."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vmitin.remotepc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 49ZG648WG8   # Personal Team (Вячеслав Митин)
        CODE_SIGN_ENTITLEMENTS: RemotePC/RemotePC.entitlements
        # NOTE: entitlement com.apple.developer.networking.multicast (broadcast WoL)
        # НЕДОСТУПЕН для Personal Team — Apple требует платный аккаунт.
        # WoL в iOS/watch-клиентах идёт через relay (POST /wol на веб-сервере NAS).

  RemotePC-Watch:
    type: application
    platform: watchOS
    sources:
      - path: RemotePC
        excludes:
          - RemotePCApp.swift   # iOS @main entrypoint
          - ContentView.swift   # iOS-экран
          - SettingsView.swift  # iOS-экран
          - Assets.xcassets     # iOS-иконка
          - Info.plist          # iOS-Info.plist
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true   # приложение watchOS
        # Companion-приложение (НЕ standalone/WKWatchOnly): зависит от iOS-компаньона
        # ru.vmitin.remotepc, чтобы принимать настройки через WatchConnectivity.
        # Standalone (WKWatchOnly) НЕЛЬЗЯ: Apple запрещает таким app'ам пользоваться
        # WatchConnectivity для передачи данных от iOS-компаньона
        # (WCSession «counterpart app not installed»).
        # Ключ обязателен: watch app обязан иметь либо WKWatchOnly, либо
        # WKCompanionAppBundleIdentifier (иначе install fail, CoreDeviceError 3002).
        WKCompanionAppBundleIdentifier: ru.vmitin.remotepc
        CFBundleDisplayName: "Удалённый ПК"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # plain HTTP в локальной сети
        NSLocalNetworkUsageDescription: "Приложению нужен доступ к локальной сети, чтобы видеть сервер на ПК и отправлять WoL."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vmitin.remotepc.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_TEAM: 49ZG648WG8   # Personal Team (Вячеслав Митин)
        CODE_SIGN_ENTITLEMENTS: RemotePC/RemotePC.entitlements
